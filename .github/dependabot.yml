version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    groups:
      codemirror:
        patterns: ["@codemirror/*", "@lezer/*"]
      tauri:
        patterns: ["@tauri-apps/*"]
      dev:
        dependency-type: development
  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
