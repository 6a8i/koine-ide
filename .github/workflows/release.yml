# Release: ao criar uma tag vX.Y.Z, gera os instaladores (Windows .exe/.msi, Linux .AppImage/.deb, macOS .dmg)
# e publica em Releases. Execução manual (workflow_dispatch) só gera os artefatos, sem publicar.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    name: Versão da tag confere com o projeto
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - name: Compara a tag com package.json e tauri.conf.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          TAURI=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "tag=$TAG package.json=$PKG tauri.conf.json=$TAURI"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$TAURI" ]; then
            echo "::error::A tag v$TAG não bate com a versão do projeto ($PKG / $TAURI). Atualize as versões antes de criar a tag."
            exit 1
          fi

  tests:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: ${{ matrix.name }}
    needs: [check-version, tests]
    # check-version é pulado na execução manual; nas tags precisa ter passado
    if: ${{ always() && needs.tests.result == 'success' && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            args: ""
            artifact: koine-ide-windows
            paths: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/portable/*.zip
          - name: Linux (x64)
            os: ubuntu-22.04
            args: ""
            artifact: koine-ide-linux
            paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
          - name: macOS (universal)
            os: macos-latest
            args: "--target universal-apple-darwin"
            artifact: koine-ide-macos
            paths: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          # o binário universal do macOS precisa das duas arquiteturas
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Dependências do sistema (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev build-essential curl wget file
      - run: npm ci
      - name: Build e publicação (tauri-action)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # em tag: cria/atualiza a release dessa tag; em execução manual: só gera os artefatos
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: "Koiné IDE v__VERSION__"
          releaseBody: |
            Koiné IDE para Windows, Linux e macOS. Todos os arquivos são gerados automaticamente pelo GitHub Actions a partir desta tag.

            **Windows 10/11 (64 bits)**
            - `Koine.IDE_x.y.z_x64-setup.exe`: instalador recomendado (instala só para o usuário atual, sem precisar de administrador)
            - `Koine.IDE_x.y.z_x64_pt-BR.msi`: instalador MSI, para quem prefere ou para distribuição em rede
            - `Koine.IDE_x.y.z_x64-portable.zip`: versão portátil, sem instalação (pendrive, laboratório); os dados ficam na pasta do programa
            - ou pelo terminal: `winget install BznDigital.KoineIDE`

            **Linux (x86-64)**
            - `Koine.IDE_x.y.z_amd64.AppImage`: funciona em qualquer distribuição; dê permissão de execução (`chmod +x`) e abra
            - `Koine.IDE_x.y.z_amd64.deb`: Debian, Ubuntu, Mint e derivados (`sudo apt install ./Koine.IDE_x.y.z_amd64.deb`)

            **macOS 11 ou mais recente (Intel e Apple Silicon)**
            - `Koine.IDE_x.y.z_universal.dmg`: abra e arraste para Aplicativos

            Os instaladores ainda não são assinados. No Windows, o SmartScreen pode avisar "editor desconhecido": clique em "Mais informações" → "Executar assim mesmo". No macOS, na primeira vez clique com o botão direito no aplicativo → "Abrir" → "Abrir". Veja o guia: https://6a8i.github.io/koine-ide/guia.html#instalar
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadReleaseAssets: ${{ startsWith(github.ref, 'refs/tags/v') }}
          args: ${{ matrix.args }}
      - name: Versão portátil (.zip) para Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $stage = "src-tauri/target/release/portable-stage/Koine IDE"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "src-tauri/target/release/koine-ide.exe" "$stage/Koine IDE.exe"
          New-Item -ItemType File -Force "$stage/portable" | Out-Null
          Copy-Item "winget/LEIA-ME-portatil.txt" "$stage/LEIA-ME.txt"
          New-Item -ItemType Directory -Force "src-tauri/target/release/bundle/portable" | Out-Null
          $zip = "src-tauri/target/release/bundle/portable/Koine.IDE_$($version)_x64-portable.zip"
          Compress-Archive -Path "$stage" -DestinationPath $zip -Force
          Get-Item $zip | Select-Object Name, Length
      - name: Anexa a versão portátil à release
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" (Get-ChildItem src-tauri/target/release/bundle/portable/*.zip).FullName --clobber
      - name: Guarda os instaladores como artefato do workflow
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  winget:
    name: Publica no winget
    needs: [build]
    # só em tags; sem o segredo WINGET_TOKEN (PAT com escopo public_repo da conta que abre o PR em microsoft/winget-pkgs) apenas avisa
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' }}
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Sem token, só avisa
        if: env.WINGET_TOKEN == ''
        run: echo "::notice::Segredo WINGET_TOKEN ausente; os manifestos do winget não foram enviados. Veja winget/README.md."
      - name: Gera os manifestos com a versão e o hash do instalador publicado
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $url = "https://github.com/${{ github.repository }}/releases/download/v$version/Koine.IDE_$($version)_x64-setup.exe"
          Invoke-WebRequest $url -OutFile setup.exe
          $sha = (Get-FileHash setup.exe -Algorithm SHA256).Hash
          node scripts/winget-manifests.mjs $version $sha "${{ github.repository }}"
          Get-ChildItem -Recurse winget/out -File | Select-Object FullName
      - name: Envia o PR para microsoft/winget-pkgs (wingetcreate)
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          $dir = (Get-ChildItem -Recurse winget/out -Filter *.installer.yaml | Select-Object -First 1).DirectoryName
          .\wingetcreate.exe submit --token $env:WINGET_TOKEN --prtitle "Koiné IDE ${{ github.ref_name }}" $dir
