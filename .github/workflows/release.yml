# Release: ao criar uma tag vX.Y.Z, gera o instalador do Windows (.exe NSIS e .msi) e publica em Releases.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    name: Versão da tag confere com o projeto
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - name: Compara a tag com package.json e tauri.conf.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          TAURI=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "tag=$TAG package.json=$PKG tauri.conf.json=$TAURI"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$TAURI" ]; then
            echo "::error::A tag v$TAG não bate com a versão do projeto ($PKG / $TAURI). Atualize as versões antes de criar a tag."
            exit 1
          fi

  tests:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  windows:
    name: Instalador do Windows
    needs: [check-version, tests]
    # check-version é pulado na execução manual; nas tags precisa ter passado
    if: ${{ always() && needs.tests.result == 'success' && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build e publicação (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # em tag: cria/atualiza a release dessa tag; em execução manual: só gera os artefatos
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: "Koiné IDE v__VERSION__"
          releaseBody: |
            Instalador do Koiné IDE para Windows 10/11 (64 bits).

            - **Koine.IDE_x.y.z_x64-setup.exe**: instalador recomendado (NSIS, instala só para o usuário atual, sem precisar de administrador)
            - **Koine.IDE_x.y.z_x64_pt-BR.msi**: instalador MSI, para quem prefere ou para distribuição em rede

            Baixe, execute e abra um arquivo `.koi`. O Windows pode avisar que o editor é desconhecido porque o instalador não é assinado; clique em "Mais informações" → "Executar assim mesmo".
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadReleaseAssets: ${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Guarda os instaladores como artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: koine-ide-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
