# Site de documentação (GitHub Pages): https://6a8i.github.io/koine-ide/
# Publica a pasta docs/ com as páginas geradas a partir do código (referência, exemplos, idiomas).
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/build-docs.ts"
      - "scripts/docs-layout.ts"
      - "src/reference/**"
      - "src/examples/**"
      - "src/lang/i18n/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Gera referência, exemplos e idiomas
        run: node --import tsx scripts/build-docs.ts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
