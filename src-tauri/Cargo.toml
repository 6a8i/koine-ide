[package]
name = "portugol-ide"
version = "0.1.0"
description = "IDE leve para aprender programação com Portugol (Portugol Studio e VisuAlg)"
authors = ["Bzn Digital"]
edition = "2021"

[lib]
name = "portugol_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
